name: Deploy Quartz v5 to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Set GitHub Pages baseUrl
        run: |
          TARGET_FILE="quartz.config.yaml"
          [ ! -f "$TARGET_FILE" ] && TARGET_FILE="quartz.config.default.yaml"
          sed -i '/^baseUrl:/d' "$TARGET_FILE"
          echo 'baseUrl: "signalsbanck/biosignalsbank"' >> "$TARGET_FILE"
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
